<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Senlie Budget code</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#101012;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f5f7;padding:36px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.06);">
            <tr>
              <td style="padding:40px 36px 12px;text-align:center;">
                <div style="display:inline-block;width:54px;height:54px;line-height:54px;border-radius:18px;background:#eef0ff;color:#5965f3;font-size:25px;font-weight:800;letter-spacing:-1px;">S</div>
                <div style="margin-top:18px;font-size:22px;font-weight:750;letter-spacing:-.4px;">Senlie Budget</div>
                <div style="margin-top:5px;font-size:13px;color:#77777d;">Your money, clearly.</div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 36px 12px;text-align:center;">
                <div style="font-size:15px;color:#55555b;line-height:1.55;">Use this one-time code to continue to Senlie Budget.</div>
                <div style="margin:24px auto 20px;padding:18px 20px;border-radius:16px;background:#f5f5f7;font-size:34px;line-height:1;font-weight:780;letter-spacing:10px;color:#101012;">{{ .Token }}</div>
                <div style="font-size:12px;line-height:1.6;color:#8a8a90;">This code is single-use. If you did not request it, you can safely ignore this email.</div>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 36px 36px;text-align:center;">
                <div style="height:1px;background:#ececef;margin-bottom:22px;"></div>
                <div style="font-size:11px;color:#a0a0a6;">Senlie Budget · A Senlie Technologies product</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
