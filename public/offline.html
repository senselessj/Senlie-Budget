<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#5965F3" />
  <title>Senlie Budget — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7;color:#101012;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px}.card{width:min(420px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.07);text-align:center}.logo{width:58px;height:58px;margin:0 auto 22px}.title{font-size:24px;font-weight:700;letter-spacing:-.04em}.copy{margin:10px auto 24px;color:#6e6e73;font-size:15px;line-height:1.5;max-width:300px}.button{display:inline-flex;align-items:center;justify-content:center;background:#101012;color:#fff;text-decoration:none;border-radius:999px;padding:12px 20px;font-weight:600;font-size:14px}@media(prefers-color-scheme:dark){body{background:#000;color:#f5f5f7}.card{background:#171719}.copy{color:#98989d}.button{background:#f5f5f7;color:#101012}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icon-192.png" alt="" />
    <div class="title">You're offline.</div>
    <div class="copy">Senlie Budget keeps financial data fresh from your account, so reconnect to continue safely.</div>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
